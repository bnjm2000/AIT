<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AVEC Inventory Tracker</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .login-container {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: clamp(24px, 6vw, 40px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.2);
        width: 100%;
        max-width: 400px;
      }

      .login-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .login-title {
        color: #764ba2;
        font-size: 2rem;
        margin-bottom: 10px;
      }

      .login-subtitle {
        color: #666;
        font-size: 1rem;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
      }

      .form-input {
        width: 100%;
        padding: 15px;
        border: 2px solid #e9ecef;
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s ease;
        background: white;
      }

      .form-input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .login-btn {
        width: 100%;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
      }

      .login-btn:focus-visible,
      .form-input:focus-visible {
        outline: 3px solid #4f46e5;
        outline-offset: 2px;
      }

      .login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .error-message {
        background: #f8d7da;
        color: #721c24;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }

      .loading {
        display: none;
        text-align: center;
        margin-top: 10px;
        color: #666;
      }

      .loading::after {
        content: "";
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid #f3f3f3;
        border-top: 2px solid #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-left: 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .demo-info {
        background: #d1ecf1;
        color: #0c5460;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        text-align: center;
      }

      .demo-info strong {
        display: block;
        margin-bottom: 5px;
      }

      @media (max-width: 420px) {
        .login-title {
          font-size: 1.55rem;
        }

        .login-subtitle {
          font-size: 0.95rem;
        }
      }


      /* 2026 login accessibility polish */
      :root {
        --brand-main: #5b4ee6;
        --brand-dark: #4438ca;
        --focus-ring: 0 0 0 4px rgba(79, 70, 229, 0.22);
      }

      .login-container {
        border: 1px solid rgba(255, 255, 255, 0.55);
      }

      .login-title {
        line-height: 1.1;
      }

      .form-input {
        min-height: 48px;
        border-color: #cbd5e1;
      }

      .form-input::placeholder {
        color: #94a3b8;
      }

      .form-input[aria-invalid="true"] {
        border-color: #b91c1c;
        box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.12);
      }

      .form-input:focus,
      .form-input:focus-visible {
        border-color: var(--brand-main);
        box-shadow: var(--focus-ring);
      }

      .login-btn {
        min-height: 48px;
      }

      .login-btn:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .error-message {
        border: 1px solid #f1b0b7;
        line-height: 1.4;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }

        .login-btn:hover {
          transform: none !important;
        }
      }

      @media (forced-colors: active) {
        .login-container,
        .form-input,
        .login-btn,
        .error-message {
          border: 1px solid CanvasText;
        }
      }

    </style>
  </head>
  <body>
    <main class="login-container" role="main">
      <div class="login-header">
        <h1 class="login-title">Avec Inventory Tracker</h1>
        <p class="login-subtitle">Please sign in to continue</p>
      </div>

      <div class="error-message" id="error-message" role="alert" aria-live="assertive"></div>

      <form id="loginForm" aria-describedby="error-message">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input
            type="text"
            class="form-input"
            id="username"
            name="username"
            required
            autocomplete="username"
            spellcheck="false"
            aria-invalid="false"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            class="form-input"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            aria-invalid="false"
          />
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Sign In</button>

        <div class="loading" id="loading" role="status" aria-live="polite">Signing in...</div>
      </form>
    </main>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const username = document.getElementById("username").value;
          const password = document.getElementById("password").value;
          const loginBtn = document.getElementById("loginBtn");
          const loading = document.getElementById("loading");
          const errorMessage = document.getElementById("error-message");

          // Reset error state
          errorMessage.style.display = "none";
          document.getElementById("username").setAttribute("aria-invalid", "false");
          document.getElementById("password").setAttribute("aria-invalid", "false");
          loginBtn.setAttribute("aria-busy", "true");

          // Show loading state
          loginBtn.disabled = true;
          loading.style.display = "block";

          try {
            const response = await fetch("/login", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ username, password }),
            });

            const result = await response.json();

            if (result.success) {
              // Redirect to main application
              window.location.href = "/";
            } else {
              // Show error message
              errorMessage.textContent = result.message || "Login failed";
              errorMessage.style.display = "block";
              document.getElementById("username").setAttribute("aria-invalid", "true");
              document.getElementById("password").setAttribute("aria-invalid", "true");
              document.getElementById("password").focus();
            }
          } catch (error) {
            errorMessage.textContent = "Network error. Please try again.";
            errorMessage.style.display = "block";
            document.getElementById("username").setAttribute("aria-invalid", "true");
            document.getElementById("password").setAttribute("aria-invalid", "true");
          } finally {
            // Reset loading state
            loginBtn.disabled = false;
            loginBtn.setAttribute("aria-busy", "false");
            loading.style.display = "none";
          }
        });

      // Auto-focus username field
      document.getElementById("username").focus();

      // Fill demo credentials on page load
      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
      });
    </script>
  </body>
</html>
