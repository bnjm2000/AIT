<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Sign In - AIM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css', v=login_css_version) }}" />
  </head>
  <body>
    <main class="access-shell">
      <header class="access-brand">
        <strong>AIM</strong>
        <span>AVEC INVENTORY MANAGEMENT</span>
        <h1>Welcome</h1>
        <p>Select how you would like to continue.</p>
      </header>

      <section class="access-card">
        <div class="access-choice-grid" aria-label="Choose sign-in type">
          <button class="access-choice" id="adminChoice" type="button">
            <span class="choice-check">✓</span>
            <span class="choice-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <circle cx="10" cy="7" r="3"></circle>
                <path d="M4 20v-2.2A4.8 4.8 0 0 1 8.8 13h2.4c.7 0 1.4.2 2 .4"></path>
                <path d="M18 11.5 21 13v3.1c0 2-1.2 3.7-3 4.9-1.8-1.2-3-2.9-3-4.9V13z"></path>
                <path d="m16.8 16.1.8.8 1.7-1.9"></path>
              </svg>
            </span>
            <strong>Admin sign-in</strong>
            <small>For event admins and internal users</small>
            <span class="choice-action">Sign in</span>
          </button>
          <button class="access-choice" id="workerChoice" type="button">
            <span class="choice-check">✓</span>
            <span class="choice-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M4 14a8 8 0 0 1 16 0"></path>
                <path d="M8 14V9.5M16 14V9.5"></path>
                <path d="M3 14h18"></path>
                <path d="M7 18.5h10"></path>
                <path d="M9 14v2.5h6V14"></path>
              </svg>
            </span>
            <strong>I am a worker</strong>
            <small>Access your events and submit invoices &amp; claims</small>
            <span class="choice-action">Continue</span>
          </button>
        </div>

        <section class="access-panel" id="workerPanel" hidden>
          <div class="panel-icon" aria-hidden="true">↓</div>
          <h2>Worker Invoice &amp; Claims</h2>
          <p id="workerInstruction">Enter your phone number to find your events.</p>

          <form id="workerLookupForm">
            <label class="phone-field">
              <span class="country-code">🇸🇬 &nbsp; +65</span>
              <input id="workerPhone" type="tel" inputmode="tel" autocomplete="tel"
                     placeholder="9123 4567" required />
            </label>
            <button class="access-primary" type="submit" id="findEventsButton">Find My Events</button>
          </form>

          <form id="workerCredentialForm" hidden>
            <input id="credentialPhone" type="hidden" />
            <div class="credential-type" id="credentialTypeChoice">
              <label><input type="radio" name="credentialType" value="pin" checked /> PIN</label>
              <label><input type="radio" name="credentialType" value="password" /> Password</label>
            </div>
            <label class="access-field">
              <span id="credentialLabel">Create a 4–8 digit PIN</span>
              <input id="workerCredential" type="password" inputmode="numeric"
                     autocomplete="new-password" required />
            </label>
            <label class="access-field" id="confirmationField">
              <span>Confirm PIN</span>
              <input id="workerCredentialConfirmation" type="password"
                     inputmode="numeric" autocomplete="new-password" />
            </label>
            <button class="access-primary" type="submit" id="workerAccessButton">Create PIN &amp; Continue</button>
            <button class="text-action" type="button" id="changeWorkerPhone">Use another phone number</button>
          </form>

          <p class="privacy-copy">▣ &nbsp; Your worker account and submissions are private.</p>
          <div class="access-message" id="workerMessage" role="alert" aria-live="polite"></div>
        </section>

        <section class="access-panel" id="adminPanel" hidden>
          <div class="panel-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <circle cx="10" cy="7" r="3"></circle>
              <path d="M4 20v-2.2A4.8 4.8 0 0 1 8.8 13h2.4c.7 0 1.4.2 2 .4"></path>
              <path d="M18 11.5 21 13v3.1c0 2-1.2 3.7-3 4.9-1.8-1.2-3-2.9-3-4.9V13z"></path>
              <path d="m16.8 16.1.8.8 1.7-1.9"></path>
            </svg>
          </div>
          <h2>Admin Sign-in</h2>
          <p>Sign in to manage events, inventory, manpower and payments.</p>
          <form id="loginForm">
            <label class="access-field"><span>Username</span>
              <input id="username" type="text" autocomplete="username" required />
            </label>
            <label class="access-field"><span>Password</span>
              <input id="password" type="password" autocomplete="current-password" required />
            </label>
            <button class="access-primary" type="submit" id="loginBtn">Sign In</button>
          </form>
          <div class="access-message" id="adminMessage" role="alert" aria-live="polite"></div>
        </section>
      </section>
    </main>
    <script src="{{ url_for('static', filename='js/login.js', v=login_js_version) }}"></script>
  </body>
</html>
